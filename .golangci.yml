version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - bodyclose
    - gocritic
    - nilerr
    - makezero
    - unconvert
    - nolintlint

formatters:
  enable:
    - goimports
    - gofmt


