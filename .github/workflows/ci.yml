name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: |
          golangci-lint run \
            --timeout=5m \
            --enable=govet,staticcheck,errcheck,ineffassign,unused \
            ./core/... ./serverkit/... ./cachekit/... ./databasekit/...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Download Go modules
        run: |
          for dir in core cachekit databasekit serverkit; do
            echo "Downloading modules for $dir..."
            (cd $dir && go mod download)
          done

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic \
            ./core/... ./serverkit/... ./cachekit/... ./databasekit/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build all modules
        run: |
          cd core && go build ./...
          cd ../cachekit && go build ./...
          cd ../databasekit && go build ./...
          cd ../serverkit && go build ./...
          cd ..
