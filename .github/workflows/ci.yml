name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Setup Go Workspace
        run: |
          go work init
          go work use ./core ./cachekit ./databasekit ./serverkit

      - name: Run golangci-lint
        run: |
          golangci-lint run \
            --timeout=5m \
            --enable=govet,staticcheck,errcheck,ineffassign,unused \
            ./core/... ./serverkit/... ./cachekit/... ./databasekit/...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Go Workspace
        run: |
          go work init
          go work use ./core ./cachekit ./databasekit ./serverkit

      - name: Download Go modules
        run: go work sync

      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic \
            ./core/... ./serverkit/... ./cachekit/... ./databasekit/...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup Go Workspace
        run: |
          go work init
          go work use ./core ./cachekit ./databasekit ./serverkit

      - name: Build all modules
        run: go build ./core/... ./cachekit/... ./databasekit/... ./serverkit/...
